spring:
    datasource:
        url: ${DB_URL}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
    jpa:
        open-in-view: false
        hibernate:
            ddl-auto: validate
        properties:
            hibernate:
                default_schema: control_practicantes
                format_sql: true
    flyway:
        enabled: true
        default-schema: control_practicantes
        schemas:
            - control_practicantes
        locations:
            - classpath:db/migration

server:
    port: ${SERVER_PORT:8080}

management:
    endpoint:
        health:
            show-details: always

logging:
    level:
        pe.com.rsolutionsit.controlpracticantes: DEBUG
        org.hibernate.SQL: DEBUG
        org.hibernate.orm.jdbc.bind: TRACE
        org.flywaydb: INFO

security:
    jwt:
        secret: ${JWT_SECRET}
    cors:
        allowed-origins:
            - http://localhost:4200
            - http://localhost:5173
