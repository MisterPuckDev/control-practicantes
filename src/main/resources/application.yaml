spring:

    application:
        name: intern-hours-control-system

    profiles:
        active: dev

server:
    servlet:
        context-path: /api

management:
    endpoints:
        web:
            exposure:
                include: health,info

logging:
    pattern:
        console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger - %msg%n"
