spring:
    datasource:
        url: ${DB_URL}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}

    jpa:
        open-in-view: false
        hibernate:
            ddl-auto: validate

    flyway:
        enabled: true

server:
    port: ${SERVER_PORT:8080}

security:
    jwt:
        secret: ${JWT_SECRET}
        expiration: ${JWT_EXPIRATION}
